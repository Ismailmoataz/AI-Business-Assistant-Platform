name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://test:test@localhost/test
      MINIO_ACCESS_KEY: test-access-key
      MINIO_SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret-key-for-isolated-tests

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Typecheck production infrastructure
        run: >-
          mypy
          app/config/settings.py
          app/database/connection.py
          app/services/infrastructure.py
          app/ai/providers.py
          app/observability.py
          app/api/routes/health.py
          app/main.py
      - name: Static security analysis
        run: bandit -q -r app -ll
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Unit and API tests
        run: pytest -m "not integration" --junitxml=test-results/backend.xml
      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  migrations:
    name: PostgreSQL migrations and RAG integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_business_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ai_business_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/ai_business_test
      TEST_POSTGRES_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/ai_business_test
      MINIO_ACCESS_KEY: test-access-key
      MINIO_SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret-key-for-isolated-tests

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify one migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Apply, reverse, and reapply migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: PostgreSQL and pgvector integration
        run: pytest -m integration tests/test_rag_integration.py --junitxml=test-results/integration.xml
      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3101

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build

  playwright:
    name: Playwright browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3101
      E2E_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3100

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Container build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            file: infrastructure/docker/backend/dockerfile
            build_args: ""
          - image: frontend
            context: frontend
            file: infrastructure/docker/frontend/dockerfile
            build_args: NEXT_PUBLIC_API_URL=http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ai-business-assistant-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
