name: ai-business-assistant

x-app-environment: &app-environment
  PROJECT_NAME: ${PROJECT_NAME:-AI Business Assistant Platform}
  SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_SSL: ${REDIS_SSL:-false}
  REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-3}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-3}
  REDIS_HEALTH_CHECK_INTERVAL_SECONDS: ${REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
  REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES:-3}
  REDIS_RETRY_BACKOFF_SECONDS: ${REDIS_RETRY_BACKOFF_SECONDS:-0.2}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-company-documents}
  MINIO_CONNECT_TIMEOUT_SECONDS: ${MINIO_CONNECT_TIMEOUT_SECONDS:-3}
  MINIO_READ_TIMEOUT_SECONDS: ${MINIO_READ_TIMEOUT_SECONDS:-30}
  MINIO_MAX_CONNECTIONS: ${MINIO_MAX_CONNECTIONS:-20}
  MINIO_MAX_RETRIES: ${MINIO_MAX_RETRIES:-3}
  DOCUMENT_MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-26214400}
  DOCUMENT_SIGNED_URL_EXPIRY_SECONDS: ${DOCUMENT_SIGNED_URL_EXPIRY_SECONDS:-300}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-ai-business-assistant}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-business-assistant-api}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
  PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
  INVITATION_EXPIRE_DAYS: ${INVITATION_EXPIRE_DAYS:-7}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-200}
  UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-5}
  UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: ${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-business-assistant-api}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  CHAT_PROVIDER: ${CHAT_PROVIDER:-}
  META_API_KEY: ${META_API_KEY:-}
  META_BASE_URL: ${META_BASE_URL:-https://api.llama.com/v1}
  CHAT_MODEL: ${CHAT_MODEL:-}
  CHAT_FALLBACK_MODEL: ${CHAT_FALLBACK_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
  AI_POOL_TIMEOUT_SECONDS: ${AI_POOL_TIMEOUT_SECONDS:-5}
  AI_MAX_CONNECTIONS: ${AI_MAX_CONNECTIONS:-50}
  AI_MAX_KEEPALIVE_CONNECTIONS: ${AI_MAX_KEEPALIVE_CONNECTIONS:-20}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
  AI_RETRY_BACKOFF_SECONDS: ${AI_RETRY_BACKOFF_SECONDS:-0.5}
  CHUNK_SIZE: ${CHUNK_SIZE:-1000}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  TOP_K: ${TOP_K:-8}
  MAX_CONTEXT_SIZE: ${MAX_CONTEXT_SIZE:-12000}
  MINIMUM_SIMILARITY_SCORE: ${MINIMUM_SIMILARITY_SCORE:-0.2}
  AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-}

x-service-security: &service-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-5}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *json-logging

  redis:
    image: redis:8.6.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --save 60 1000
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *json-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - data
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *json-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_DOCUMENTS_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_DOCUMENTS_BUCKET}" &&
        mc version enable "local/$${MINIO_DOCUMENTS_BUCKET}"
    environment:
      HOME: /tmp
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-company-documents}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *json-logging

  pgadmin:
    image: dpage/pgadmin4:9.16
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.invalid}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-disabled-pgadmin-profile}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Authorized administrative access only'"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  migrate:
    image: ${BACKEND_IMAGE:-ai-business-assistant-backend:local}
    build:
      context: backend
      dockerfile: ../infrastructure/docker/backend/dockerfile
      target: runtime
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    <<: *service-security
    logging: *json-logging

  backend:
    image: ${BACKEND_IMAGE:-ai-business-assistant-backend:local}
    build:
      context: backend
      dockerfile: ../infrastructure/docker/backend/dockerfile
      target: runtime
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    <<: *service-security
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *json-logging

  frontend:
    image: ${FRONTEND_IMAGE:-ai-business-assistant-frontend:local}
    build:
      context: frontend
      dockerfile: ../infrastructure/docker/frontend/dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    <<: *service-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *json-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
